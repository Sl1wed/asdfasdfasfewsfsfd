<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sl1wed</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER / LOGO
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 78px;

    display: flex;
    align-items: center;

    padding: 6px 18px;

    background: rgba(5,5,5,.88);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid #1c1c1c;
}

.logo {
    width: 290px;
    height: 65px;

    object-fit: contain;
    object-position: left center;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 18px 80px;
}

.small-title {
    color: #666;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    font-size: clamp(40px, 7vw, 70px);
    letter-spacing: -4px;
}

.description {
    color: #777;
    margin-top: 10px;
}

/* =========================
   SEARCH / BUTTONS
========================= */

.tools {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin: 25px 0 15px;
}

.search {
    flex: 1;
    min-width: 220px;

    padding: 12px 14px;

    background: #0c0c0c;
    color: white;

    border: 1px solid #252525;
    border-radius: 12px;

    outline: none;
}

.search:focus {
    border-color: #555;
}

button {
    font-family: inherit;
}

.button,
.tab {
    padding: 10px 15px;

    background: #0c0c0c;
    color: #aaa;

    border: 1px solid #252525;
    border-radius: 11px;

    cursor: pointer;

    font-weight: bold;

    transition:
        transform .18s,
        background .18s,
        color .18s,
        border-color .18s;
}

.button:hover,
.tab:hover {
    transform: translateY(-2px);
    border-color: #444;
    color: white;
}

.tab.active,
.button.primary {
    background: white;
    color: black;
    border-color: white;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

/* =========================
   STATUS
========================= */

.info {
    display: flex;
    justify-content: space-between;

    color: #666;

    font-size: 12px;

    margin-bottom: 14px;
}

/* =========================
   GALLERY
========================= */

.gallery {
    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 13px;
}

.card {
    background: #0a0a0a;

    border: 1px solid #1d1d1d;

    border-radius: 15px;

    overflow: hidden;

    cursor: pointer;

    animation: appear .4s both;

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;
}

.card:hover {
    transform: translateY(-5px);

    border-color: #444;

    box-shadow:
        0 20px 50px rgba(0,0,0,.8);
}

.card img {
    width: 100%;
    aspect-ratio: 1 / 1;

    display: block;

    object-fit: cover;

    background: #080808;
}

.card-info {
    display: flex;
    justify-content: space-between;

    gap: 8px;

    padding: 9px 10px;

    color: #666;

    font-size: 11px;
}

.filename {
    color: #aaa;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty {
    padding: 80px 20px;

    text-align: center;

    color: #666;

    border: 1px dashed #222;

    border-radius: 15px;
}

.loading {
    display: none;

    justify-content: center;

    padding: 70px;
}

.spinner {
    width: 28px;
    height: 28px;

    border: 2px solid #222;

    border-top-color: white;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

/* =========================
   PAGINATION
========================= */

.pagination {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;

    margin-top: 30px;
}

/* =========================
   FULLSCREEN VIEWER
========================= */

.viewer {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.93);

    backdrop-filter: blur(15px);
}

.viewer.active {
    display: flex;
}

.viewer-content {
    width: min(1150px, 100%);
    height: min(88vh, 850px);

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;
}

.viewer-image {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    border-radius: 14px;

    box-shadow:
        0 30px 120px black;
}

.viewer-button {
    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 1px solid #333;

    background: rgba(20,20,20,.85);

    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 5;
}

.viewer-button:hover {
    background: white;
    color: black;
}

.close {
    top: 0;
    right: 0;
}

.previous {
    left: 0;
    top: 50%;

    transform: translateY(-50%);
}

.next {
    right: 0;
    top: 50%;

    transform: translateY(-50%);
}

.viewer-name {
    position: absolute;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    max-width: 75%;

    padding: 8px 14px;

    border: 1px solid #333;

    background: rgba(20,20,20,.85);

    border-radius: 999px;

    color: #aaa;

    font-size: 12px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

/* =========================
   WARNING
========================= */

.warning {
    position: fixed;

    inset: 0;

    z-index: 300;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.92);

    backdrop-filter: blur(15px);
}

.warning.active {
    display: flex;
}

.warning-box {
    width: min(470px, 100%);

    padding: 28px;

    background: #0b0b0b;

    border: 1px solid #292929;

    border-radius: 20px;

    box-shadow:
        0 30px 120px black;
}

.warning-box h2 {
    margin-top: 0;
}

.warning-box p {
    color: #999;

    line-height: 1.6;

    font-size: 14px;
}

.warning-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 9px;

    margin-top: 22px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 950px) {

    .gallery {
        grid-template-columns:
            repeat(4, minmax(0,1fr));
    }
}

@media (max-width: 650px) {

    header {
        height: 65px;
        padding: 5px 10px;
    }

    .logo {
        width: 235px;
        height: 55px;
    }

    .container {
        padding: 25px 12px 70px;
    }

    .gallery {
        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap: 9px;
    }

    .viewer-content {
        height: 82vh;
    }

    .viewer-button {
        width: 38px;
        height: 38px;
    }
}
</style>
</head>

<body>

     TOP LEFT LOGO

     Replace the src below with

========================= -->

<header>

    <img
        class="logo"
        src="sl1wed.png"
        alt="sl1wed"
    >

</header>


<main class="container">

    <div class="small-title">
        shared gallery
    </div>

    <h1>
        sl1wed
    </h1>

    <p class="description">

    </p>


    <!-- SEARCH -->

    <div class="tools">

        <input

            class="search"
            type="search"

        >

        </button>

<!-- =========================

<div

        >

        </button>

</div>

========================= -->

<div

    id="warning"
>

    <div class="warning-box">

        <h2>

        </h2>

            Continue only if you are legally permitted

        </p>

            <button
                class="button"
                id="cancelWarning"
            >
                Cancel
            </button>

            <button
                class="button primary"
                id="continueWarning"
            >
                Continue
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================
   GITHUB SETTINGS
===================================== */

const OWNER = "sl1wed";

const REPOSITORY =
    "asdfasdfasfewsfsfd";

const BRANCH =
    "main";

const IMAGES_PER_PAGE =
    50;


/* =====================================
   STATE
===================================== */

let currentFolder =
    "Anime";

let allImages =
    [];

let filteredImages =
    [];

let currentPage =
    1;

let viewerIndex =
    0;

let pendingFolder =
    null;


/* =====================================
   ELEMENTS
===================================== */

const gallery =
    document.getElementById("gallery");

const status =
    document.getElementById("status");

const pageLabel =
    document.getElementById("pageLabel");

const empty =
    document.getElementById("empty");

const loading =
    document.getElementById("loading");

const pagination =
    document.getElementById("pagination");

const search =
    document.getElementById("search");

const viewer =
    document.getElementById("viewer");

const viewerImage =
    document.getElementById("viewerImage");

const viewerName =
    document.getElementById("viewerName");

const warning =
    document.getElementById("warning");


/* =====================================
   GITHUB IMAGE URL
===================================== */

function imageURL(filename) {

    return (
        "https://raw.githubusercontent.com/" +
        OWNER +
        "/" +
        REPOSITORY +
        "/" +
        BRANCH +
        "/" +
        encodeURIComponent(currentFolder) +
        "/" +
        encodeURIComponent(filename)
    );

}


/* =====================================
   LOAD FOLDER
===================================== */

async function loadImages() {

    loading.style.display =
        "flex";

    gallery.innerHTML =
        "";

    pagination.innerHTML =
        "";

    empty.hidden =
        true;

    status.textContent =
        "Loading...";


    const apiURL =
        `https://api.github.com/repos/${OWNER}/${REPOSITORY}/contents/${encodeURIComponent(currentFolder)}?ref=${BRANCH}`;


    try {

        const response =
            await fetch(apiURL, {
                headers: {
                    Accept:
                        "application/vnd.github+json"
                }
            });


        if (!response.ok) {

            throw new Error(
                "GitHub returned " +
                response.status
            );

        }


        const files =
            await response.json();


        allImages =
            files
                .filter(file => {

                    return (
                        file.type === "file" &&
                        /\.(jpg|jpeg|png|gif|webp|avif)$/i
                            .test(file.name)
                    );

                })
                .sort((a,b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        { numeric:true }
                    )
                );


        currentPage =
            1;

        filterImages();


    } catch(error) {

        console.error(error);

        status.textContent =
            "Could not load this folder.";

        empty.hidden =
            false;

        empty.textContent =
            "Make sure the folder exists and your GitHub repository is public.";

    }


    loading.style.display =
        "none";

}


/* =====================================
   SEARCH
===================================== */

function filterImages() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    filteredImages =
        allImages.filter(image =>
            image.name
                .toLowerCase()
                .includes(query)
        );


    const pages =
        Math.max(
            1,
            Math.ceil(
                filteredImages.length /
                IMAGES_PER_PAGE
            )
        );


    currentPage =
        Math.min(
            currentPage,
            pages
        );


    renderGallery();

}


/* =====================================
   RENDER GALLERY
===================================== */

function renderGallery() {

    gallery.innerHTML =
        "";


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filteredImages.length /
                IMAGES_PER_PAGE
            )
        );


    const start =
        (currentPage - 1) *
        IMAGES_PER_PAGE;


    const pageImages =
        filteredImages.slice(
            start,
            start + IMAGES_PER_PAGE
        );


    status.textContent =
        filteredImages.length +
        " photo" +
        (filteredImages.length === 1
            ? ""
            : "s");


    pageLabel.textContent =
        totalPages > 1
            ? `Page ${currentPage} / ${totalPages}`
            : "";


    empty.hidden =
        pageImages.length !== 0;


    pageImages.forEach(
        (image,index) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "card";


            card.style.animationDelay =
                Math.min(
                    index,
                    20
                ) * 15 + "ms";


            const imageElement =
                document.createElement(
                    "img"
                );


            imageElement.loading =
                "lazy";


            imageElement.src =
                imageURL(image.name);


            imageElement.alt =
                image.name;


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "card-info";


            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "filename";


            name.textContent =
                image.name;


            const number =
                document.createElement(
                    "span"
                );


            number.textContent =
                start + index + 1;


            info.append(
                name,
                number
            );


            card.append(
                imageElement,
                info
            );


            card.onclick =
                () => openViewer(
                    start + index
                );


            gallery.append(
                card
            );

        }
    );


    renderPagination(
        totalPages
    );

}


/* =====================================
   PAGINATION
===================================== */

function renderPagination(
    totalPages
) {

    pagination.innerHTML =
        "";


    if(totalPages <= 1) {
        return;
    }


    function addButton(
        text,
        page,
        active = false,
        disabled = false
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "button" +
            (active
                ? " primary"
                : "");


        button.textContent =
            text;


        button.disabled =
            disabled;


        button.onclick =
            () => {

                currentPage =
                    page;

                renderGallery();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            };


        pagination.append(
            button
        );

    }


    addButton(
        "‹",
        currentPage - 1,
        false,
        currentPage === 1
    );


    const pages =
        [
            1,
            totalPages,
            currentPage - 1,
            currentPage,
            currentPage + 1
        ];


    const uniquePages =
        [
            ...new Set(pages)
        ]
        .filter(
            page =>
                page >= 1 &&
                page <= totalPages
        )
        .sort(
            (a,b) => a-b
        );


    let previous =
        0;


    uniquePages.forEach(
        page => {

            if(
                page -
                previous >
                1
            ) {

                const dots =
                    document.createElement(
                        "span"
                    );

                dots.textContent =
                    "...";

                dots.style.color =
                    "#555";

                pagination.append(
                    dots
                );

            }


            addButton(
                page,
                page,
                page === currentPage
            );


            previous =
                page;

        }
    );


    addButton(
        "›",
        currentPage + 1,
        false,
        currentPage === totalPages
    );

}


/* =====================================
   TABS
===================================== */

document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.addEventListener(
            "click",
            () => {

                const folder =
                    tab.dataset.folder;


                /*
                 * WARNING ONLY APPEARS ONCE
                 * PER BROWSER.
                 */

                if(
                    tab.dataset.warning ===
                    "true"
                ) {

                    const alreadySeen =
                        localStorage.getItem(
                            "sl1wed_warning_seen"
                        );


                    if(
                        alreadySeen !==
                        "true"
                    ) {

                        pendingFolder =
                            folder;

                        warning.classList.add(
                            "active"
                        );

                        return;

                    }

                }


                switchFolder(
                    folder,
                    tab
                );

            }
        );

    });


function switchFolder(
    folder,
    selectedTab
) {

    currentFolder =
        folder;


    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.remove(
                "active"
            );

        });


    selectedTab.classList.add(
        "active"
    );


    search.value =
        "";


    loadImages();

}


/* =====================================
   WARNING
===================================== */

document
    .getElementById(
        "cancelWarning"
    )
    .onclick =
    () => {

        pendingFolder =
            null;

        warning.classList.remove(
            "active"
        );

    };


document
    .getElementById(
        "continueWarning"
    )
    .onclick =
    () => {

        /*
         * Remember permanently
         * for this browser.
         */

        localStorage.setItem(
            "sl1wed_warning_seen",
            "true"
        );


        const tab =
            [
                ...document
                    .querySelectorAll(
                        ".tab"
                    )
            ]
            .find(
                tab =>
                    tab.dataset.folder ===
                    pendingFolder
            );


        warning.classList.remove(
            "active"
        );


        if(tab) {

            switchFolder(
                pendingFolder,
                tab
            );

        }


        pendingFolder =
            null;

    };


warning.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            warning
        ) {

            document
                .getElementById(
                    "cancelWarning"
                )
                .click();

        }

    }
);


/* =====================================
   FULLSCREEN VIEWER
===================================== */

function openViewer(index) {

    viewerIndex =
        index;


    updateViewer();


    viewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


function updateViewer() {

    const image =
        filteredImages[
            viewerIndex
        ];


    if(!image) {
        return;
    }


    viewerImage.src =
        imageURL(
            image.name
        );


    viewerImage.alt =
        image.name;


    viewerName.textContent =
        image.name;

}


function closeViewer() {

    viewer.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}


document
    .getElementById(
        "closeViewer"
    )
    .onclick =
    closeViewer;


document
    .getElementById(
        "previous"
    )
    .onclick =
    () => {

        if(
            !filteredImages.length
        ) {
            return;
        }


        viewerIndex =
            (
                viewerIndex -
                1 +
                filteredImages.length
            ) %
            filteredImages.length;


        updateViewer();

    };


document
    .getElementById(
        "next"
    )
    .onclick =
    () => {

        if(
            !filteredImages.length
        ) {
            return;
        }


        viewerIndex =
            (
                viewerIndex +
                1
            ) %
            filteredImages.length;


        updateViewer();

    };


viewer.onclick =
    event => {

        if(
            event.target ===
            viewer
        ) {

            closeViewer();

        }

    };


/* Keyboard controls */

document.addEventListener(
    "keydown",
    event => {

        if(
            !viewer.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if(
            event.key ===
            "Escape"
        ) {

            closeViewer();

        }


        if(
            event.key ===
            "ArrowLeft"
        ) {

            document
                .getElementById(
                    "previous"
                )
                .click();

        }


        if(
            event.key ===
            "ArrowRight"
        ) {

            document
                .getElementById(
                    "next"
                )
                .click();

        }

    }
);


/* =====================================
   SEARCH / RANDOM / REFRESH
===================================== */

search.addEventListener(
    "input",
    () => {

        currentPage =
            1;

        filterImages();

    }
);


document
    .getElementById(
        "refresh"
    )
    .onclick =
    loadImages;


document
    .getElementById(
        "random"
    )
    .onclick =
    () => {

        if(
            !filteredImages.length
        ) {

            return;

        }


        const random =
            Math.floor(
                Math.random() *
                filteredImages.length
            );


        openViewer(
