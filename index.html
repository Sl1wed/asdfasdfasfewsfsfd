<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>sl1wed</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 78px;

    display: flex;
    align-items: center;

    padding: 6px 18px;

    background: rgba(5, 5, 5, 0.9);

    backdrop-filter: blur(18px);

    border-bottom: 1px solid #1c1c1c;
}

.logo {
    width: 290px;
    height: 65px;

    object-fit: contain;
    object-position: left center;
}


/* =========================
   MAIN
========================= */

.container {
    max-width: 1200px;

    margin: auto;

    padding: 35px 18px 80px;
}

.small-title {
    color: #666;

    font-size: 11px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

h1 {
    margin: 0;

    font-size: clamp(40px, 7vw, 70px);

    letter-spacing: -4px;
}

.description {
    color: #777;

    margin-top: 10px;
}


/* =========================
   TABS
========================= */

.tabs {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 28px;

    margin-bottom: 20px;
}

.tab {
    padding: 10px 15px;

    background: #0c0c0c;

    color: #aaa;

    border: 1px solid #252525;

    border-radius: 11px;

    cursor: pointer;

    font-weight: bold;

    transition:
        transform 0.18s,
        background 0.18s,
        color 0.18s,
        border-color 0.18s;
}

.tab:hover {
    transform: translateY(-2px);

    border-color: #444;

    color: white;
}

.tab.active {
    background: white;

    color: black;

    border-color: white;
}


/* =========================
   INFO
========================= */

.info {
    display: flex;

    justify-content: space-between;

    color: #666;

    font-size: 12px;

    margin-bottom: 14px;
}


/* =========================
   GALLERY
========================= */

.gallery {
    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 13px;
}

.card {
    background: #0a0a0a;

    border: 1px solid #1d1d1d;

    border-radius: 15px;

    overflow: hidden;

    cursor: pointer;

    animation: appear 0.4s both;

    transition:
        transform 0.2s,
        border-color 0.2s,
        box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-5px);

    border-color: #444;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.8);
}

.card img {
    width: 100%;

    aspect-ratio: 1 / 1;

    display: block;

    object-fit: cover;

    background: #080808;
}


/* =========================
   EMPTY
========================= */

.empty {
    padding: 80px 20px;

    text-align: center;

    color: #666;

    border: 1px dashed #222;

    border-radius: 15px;
}


/* =========================
   LOADING
========================= */

.loading {
    display: none;

    justify-content: center;

    padding: 70px;
}

.spinner {
    width: 28px;
    height: 28px;

    border: 2px solid #222;

    border-top-color: white;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;
}


/* =========================
   PAGINATION
========================= */

.pagination {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;

    margin-top: 30px;
}

.page-button {
    padding: 10px 15px;

    background: #0c0c0c;

    color: #aaa;

    border: 1px solid #252525;

    border-radius: 11px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.18s;
}

.page-button:hover {
    color: white;

    border-color: #444;

    transform: translateY(-2px);
}

.page-button.active {
    background: white;

    color: black;

    border-color: white;
}


/* =========================
   FULLSCREEN VIEWER
========================= */

.viewer {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0, 0, 0, 0.95);

    backdrop-filter: blur(15px);
}

.viewer.active {
    display: flex;
}

.viewer-content {
    width: min(1150px, 100%);

    height: min(88vh, 850px);

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;
}

.viewer-image {
    max-width: 100%;

    max-height: 100%;

    object-fit: contain;

    border-radius: 14px;

    box-shadow:
        0 30px 120px black;
}


/* =========================
   VIEWER BUTTONS
========================= */

.viewer-button {
    position: absolute;

    width: 45px;

    height: 45px;

    border-radius: 50%;

    border: 1px solid #333;

    background: rgba(20, 20, 20, 0.9);

    color: white;

    font-size: 22px;

    cursor: pointer;

    z-index: 5;

    transition: 0.18s;
}

.viewer-button:hover {
    background: white;

    color: black;
}

.close {
    top: 0;

    right: 0;
}

.previous {
    left: 0;

    top: 50%;

    transform: translateY(-50%);
}

.next {
    right: 0;

    top: 50%;

    transform: translateY(-50%);
}


/* =========================
   WARNING
========================= */

.warning {
    position: fixed;

    inset: 0;

    z-index: 300;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0, 0, 0, 0.92);

    backdrop-filter: blur(15px);
}

.warning.active {
    display: flex;
}

.warning-box {
    width: min(470px, 100%);

    padding: 28px;

    background: #0b0b0b;

    border: 1px solid #292929;

    border-radius: 20px;

    box-shadow:
        0 30px 120px black;
}

.warning-box h2 {
    margin-top: 0;
}

.warning-box p {
    color: #999;

    line-height: 1.6;

    font-size: 14px;
}

.warning-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 9px;

    margin-top: 22px;
}

.warning-button {
    padding: 10px 15px;

    border-radius: 11px;

    border: 1px solid #252525;

    background: #0c0c0c;

    color: #aaa;

    cursor: pointer;

    font-weight: bold;
}

.warning-button:hover {
    color: white;

    border-color: #444;
}

.warning-continue {
    background: white;

    color: black;

    border-color: white;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes appear {

    from {
        opacity: 0;

        transform:
            translateY(10px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 950px) {

    .gallery {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}

@media (max-width: 650px) {

    header {
        height: 65px;

        padding: 5px 10px;
    }

    .logo {
        width: 235px;

        height: 55px;
    }

    .container {
        padding:
            25px 12px 70px;
    }

    .gallery {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 9px;
    }

    .viewer-content {
        height: 82vh;
    }

    .viewer-button {
        width: 38px;

        height: 38px;
    }

}

</style>
</head>


<body>


<!-- =================================
     LOGO
     
     Put your logo/anime-girl image
     in the repo as:

     sl1wed.png
================================= -->

<header>

    <img
        class="logo"
        src="sl1wed.png"
        alt="sl1wed"
    >

</header>



<main class="container">


    <div class="small-title">
        shared gallery
    </div>


    <h1>
        sl1wed
    </h1>


    <p class="description">
        a little corner of the internet.
    </p>



    <!-- =============================
         TABS
    ============================== -->

    <nav class="tabs">


        <button
            class="tab active"
            data-folder="Anime"
            data-warning="false"
        >
            Anime
        </button>


        <button
            class="tab"
            data-folder="Nfsw"
            data-warning="true"
        >
            Nsfw
        </button>


        <button
            class="tab"
            data-folder="Nude"
            data-warning="true"
        >
            Nude
        </button>


    </nav>



    <div class="info">

        <span id="status">
            Loading...
        </span>

        <span id="pageLabel"></span>

    </div>



    <div
        class="loading"
        id="loading"
    >

        <div class="spinner"></div>

    </div>



    <section
        class="gallery"
        id="gallery"
    ></section>



    <div
        class="empty"
        id="empty"
        hidden
    >
        No photos found.
    </div>



    <nav
        class="pagination"
        id="pagination"
    ></nav>


</main>



<!-- =================================
     FULLSCREEN IMAGE VIEWER
================================= -->

<div
    class="viewer"
    id="viewer"
>

    <div class="viewer-content">


        <button
            class="viewer-button close"
            id="closeViewer"
        >
            ×
        </button>


        <button
            class="viewer-button previous"
            id="previous"
        >
            ‹
        </button>


        <img
            class="viewer-image"
            id="viewerImage"
            alt=""
        >


        <button
            class="viewer-button next"
            id="next"
        >
            ›
        </button>


    </div>

</div>



<!-- =================================
     CONTENT WARNING
================================= -->

<div
    class="warning"
    id="warning"
>

    <div class="warning-box">


        <h2>
            ⚠ Content warning
        </h2>


        <p>
            This section may contain adult material.
            Continue only if you are legally permitted
            to view this content and want to proceed.
        </p>


        <div class="warning-buttons">


            <button
                class="warning-button"
                id="cancelWarning"
            >
                Cancel
            </button>


            <button
                class="warning-button warning-continue"
                id="continueWarning"
            >
                Continue
            </button>


        </div>


    </div>

</div>



<script>

/* =====================================
   GITHUB SETTINGS
===================================== */

const OWNER =
    "sl1wed";

const REPOSITORY =
    "asdfasdfasfewsfsfd";

const BRANCH =
    "main";


/*
    Maximum photos shown on one page.
    The user won't see this number.
*/

const IMAGES_PER_PAGE =
    50;



/* =====================================
   STATE
===================================== */

let currentFolder =
    "Anime";

let allImages =
    [];

let currentPage =
    1;

let viewerIndex =
    0;

let pendingFolder =
    null;



/* =====================================
   ELEMENTS
===================================== */

const gallery =
    document.getElementById(
        "gallery"
    );

const status =
    document.getElementById(
        "status"
    );

const pageLabel =
    document.getElementById(
        "pageLabel"
    );

const empty =
    document.getElementById(
        "empty"
    );

const loading =
    document.getElementById(
        "loading"
    );

const pagination =
    document.getElementById(
        "pagination"
    );

const viewer =
    document.getElementById(
        "viewer"
    );

const viewerImage =
    document.getElementById(
        "viewerImage"
    );

const warning =
    document.getElementById(
        "warning"
    );



/* =====================================
   GITHUB IMAGE URL
===================================== */

function imageURL(
    filename
) {

    return (
        "https://raw.githubusercontent.com/" +
        OWNER +
        "/" +
        REPOSITORY +
        "/" +
        BRANCH +
        "/" +
        encodeURIComponent(
            currentFolder
        ) +
        "/" +
        encodeURIComponent(
            filename
        )
    );

}



/* =====================================
   LOAD IMAGES
===================================== */

async function loadImages() {


    loading.style.display =
        "flex";


    gallery.innerHTML =
        "";


    pagination.innerHTML =
        "";


    empty.hidden =
        true;


    status.textContent =
        "Loading...";


    const apiURL =
        "https://api.github.com/repos/" +
        OWNER +
        "/" +
        REPOSITORY +
        "/contents/" +
        encodeURIComponent(
            currentFolder
        ) +
        "?ref=" +
        BRANCH;


    try {


        const response =
            await fetch(
                apiURL,
                {
                    headers: {
                        Accept:
                            "application/vnd.github+json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "GitHub returned " +
                response.status
            );

        }


        const files =
            await response.json();


        allImages =
            files
                .filter(
                    file => {

                        return (
                            file.type ===
                                "file"
                            &&
                            /\.(jpg|jpeg|png|gif|webp|avif)$/i
                                .test(
                                    file.name
                                )
                        );

                    }
                )
                .sort(
                    (a,b) =>
                        a.name.localeCompare(
                            b.name,
                            undefined,
                            {
                                numeric:
                                    true
                            }
                        )
                );


        currentPage =
            1;


        renderGallery();


    } catch(error) {


        console.error(error);


        status.textContent =
            "Could not load this folder.";


        empty.hidden =
            false;


        empty.textContent =
            "Make sure the folder exists and your GitHub repository is public.";

    }


    loading.style.display =
        "none";

}



/* =====================================
   RENDER GALLERY
===================================== */

function renderGallery() {


    gallery.innerHTML =
        "";


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                allImages.length /
                IMAGES_PER_PAGE
            )
        );


    currentPage =
        Math.min(
            currentPage,
            totalPages
        );


    const start =
        (
            currentPage -
            1
        ) *
        IMAGES_PER_PAGE;


    const pageImages =
        allImages.slice(
            start,
            start +
            IMAGES_PER_PAGE
        );


    status.textContent =
        allImages.length +
        " photo" +
        (
            allImages.length === 1
                ? ""
                : "s"
        );


    pageLabel.textContent =
        totalPages > 1
            ? "Page " +
              currentPage +
              " / " +
              totalPages
            : "";


    empty.hidden =
        pageImages.length !== 0;



    /* =============================
       CREATE PHOTO CARDS
    ============================== */

    pageImages.forEach(
        (
            image,
            index
        ) => {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "card";


            card.style.animationDelay =
                Math.min(
                    index,
                    20
                ) *
                15 +
                "ms";


            const imageElement =
                document.createElement(
                    "img"
                );


            imageElement.loading =
                "lazy";


            imageElement.src =
                imageURL(
                    image.name
                );


            imageElement.alt =
                "";


            /*
                IMPORTANT:
                We only append the image.

                No filename.
                No number.
                No text.
            */

            card.append(
                imageElement
            );


            card.onclick =
                () => {

                    openViewer(
                        start +
                        index
                    );

                };


            gallery.append(
                card
            );

        }
    );


    renderPagination(
        totalPages
    );

}



/* =====================================
   PAGINATION
===================================== */

function renderPagination(
    totalPages
) {


    pagination.innerHTML =
        "";


    if (
        totalPages <= 1
    ) {

        return;

    }



    function addButton(
        text,
        page,
        active = false,
        disabled = false
    ) {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-button";


        if(active) {

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            text;


        button.disabled =
            disabled;


        button.onclick =
            () => {

                currentPage =
                    page;


                renderGallery();


                window.scrollTo(
                    {
                        top: 0,
                        behavior:
                            "smooth"
                    }
                );

            };


        pagination.append(
            button
        );

    }



    addButton(
        "‹",
        currentPage - 1,
        false,
        currentPage === 1
    );



    const possiblePages = [
        1,
        totalPages,
        currentPage - 1,
        currentPage,
        currentPage + 1
    ];


    const pages =
        [
            ...new Set(
                possiblePages
            )
        ]
        .filter(
            page =>
                page >= 1 &&
                page <= totalPages
        )
        .sort(
            (a,b) =>
                a - b
        );



    let previous =
        0;


    pages.forEach(
        page => {


            if (
                page -
                previous >
                1
            ) {


                const dots =
                    document.createElement(
                        "span"
                    );


                dots.textContent =
                    "...";


                dots.style.color =
                    "#555";


                pagination.append(
                    dots
                );

            }


            addButton(
                page,
                page,
                page ===
                    currentPage
            );


            previous =
                page;

        }
    );



    addButton(
        "›",
        currentPage + 1,
        false,
        currentPage ===
            totalPages
    );

}



/* =====================================
   TABS
===================================== */

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        tab => {


            tab.addEventListener(
                "click",
                () => {


                    const folder =
                        tab.dataset.folder;



                    /*
                     * Anime:
                     * opens immediately.
                     *
                     * Nsfw / Nude:
                     * warning appears once.
                     */

                    if (
                        tab.dataset.warning ===
                        "true"
                    ) {


                        const alreadySeen =
                            localStorage.getItem(
                                "sl1wed_warning_seen"
                            );


                        if (
                            alreadySeen !==
                            "true"
                        ) {


                            pendingFolder =
                                folder;


                            warning.classList.add(
                                "active"
                            );


                            return;

                        }

                    }


                    switchFolder(
                        folder,
                        tab
                    );

                }
            );

        }
    );



/* =====================================
   SWITCH FOLDER
===================================== */

function switchFolder(
    folder,
    selectedTab
) {


    currentFolder =
        folder;


    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            tab => {

                tab.classList.remove(
                    "active"
                );

            }
        );


    selectedTab.classList.add(
        "active"
    );


    loadImages();

}



/* =====================================
   WARNING
===================================== */

document
    .getElementById(
        "cancelWarning"
    )
    .onclick =
    () => {


        pendingFolder =
            null;


        warning.classList.remove(
            "active"
        );

    };



document
    .getElementById(
        "continueWarning"
    )
    .onclick =
    () => {


        /*
         * Remember that the user
         * accepted the warning.
         */

        localStorage.setItem(
            "sl1wed_warning_seen",
            "true"
        );


        const tab =
            [
                ...document
                    .querySelectorAll(
                        ".tab"
                    )
            ]
            .find(
                tab =>
                    tab.dataset.folder ===
                    pendingFolder
            );


        warning.classList.remove(
            "active"
        );


        if(tab) {

            switchFolder(
                pendingFolder,
                tab
            );

        }


        pendingFolder =
            null;

    };



warning.addEventListener(
    "click",
    event => {


        if (
            event.target ===
            warning
        ) {


            document
                .getElementById(
                    "cancelWarning"
                )
                .click();

        }

    }
);



/* =====================================
   FULLSCREEN VIEWER
===================================== */

function openViewer(
    index
) {


    viewerIndex =
        index;


    updateViewer();


    viewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}



function updateViewer() {


    const image =
        allImages[
            viewerIndex
        ];


    if (!image) {

        return;

    }


    viewerImage.src =
        imageURL(
            image.name
        );


    /*
     * Deliberately blank.
     *
     * No filename is shown.
     */

    viewerImage.alt =
        "";

}



function closeViewer() {


    viewer.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}



/* =====================================
   VIEWER CONTROLS
===================================== */

document
    .getElementById(
        "closeViewer"
    )
    .onclick =
    closeViewer;



document
    .getElementById(
        "previous"
    )
    .onclick =
    () => {


        if (
            !allImages.length
        ) {

            return;

        }


        viewerIndex =
            (
                viewerIndex -
                1 +
                allImages.length
            ) %
            allImages.length;


        updateViewer();

    };



document
    .getElementById(
        "next"
    )
    .onclick =
    () => {


        if (
            !allImages.length
        ) {

            return;

        }


        viewerIndex =
            (
                viewerIndex +
                1
            ) %
            allImages.length;


        updateViewer();

    };



/* Close when clicking outside image */

viewer.onclick =
    event => {


        if (
            event.target ===
            viewer
        ) {

            closeViewer();

        }

    };



/* =====================================
   KEYBOARD CONTROLS
===================================== */

document.addEventListener(
    "keydown",
    event => {


        if (
            !viewer.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeViewer();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            document
                .getElementById(
                    "previous"
                )
                .click();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            document
                .getElementById(
                    "next"
                )
                .click();

        }

    }
);



/* =====================================
   START SITE
===================================== */

loadImages();

</script>

</body>
</html>
